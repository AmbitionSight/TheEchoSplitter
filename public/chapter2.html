<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>析声者 · 第二章 · 裂谷</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>

  <div id="title" class="screen center slab hidden">
    <div class="rune-float" aria-hidden="true">ᚵ</div>
    <h1>析声者</h1>
    <p class="sub">CHAPTER TWO · RAVINE</p>
    <button id="btn-start" class="btn primary">开 始</button>
  </div>

  <div id="prologue" class="screen center slab hidden">
    <p>门后是一条幽深的走廊。</p>
    <p>地板在这里断开了一道裂缝。</p>
    <p>对面有光。</p>
    <p class="tap">点击继续</p>
  </div>

  <div id="hud-avatar" class="slab hidden">
    <canvas id="avatar-fig" width="56" height="64" aria-hidden="true"></canvas>
    <div id="hand-slot" class="hand-slot"></div>
  </div>

  <div id="hintbar" class="hidden"><span id="hint-text"></span></div>

  <div id="hotbar" class="slab hidden">
    <div id="bar-row">
      <div id="stone-cells"></div>
      <span class="bar-sep"></span>
      <div id="item-cells"></div>
      <div id="craft-row">
        <div class="slot" data-slot="0"></div>
        <div class="slot" data-slot="1"></div>
        <div class="slot" data-slot="2"></div>
        <div class="slot" data-slot="3"></div>
      </div>
      <button class="rune-btn" id="btn-book" title="析声录">ᚵ</button>
    </div>
  </div>

  <button id="btn-jump" class="rune-btn jump hidden" title="跳跃" aria-label="跳跃"></button>

  <div id="reveal" class="screen center slab hidden">
    <div id="reveal-stones"></div>
    <div id="reveal-word">OPEN</div>
    <h2>你用声音打开了门</h2>
    <p class="sub">文字，是冻住的声音</p>
    <button id="reveal-ok" class="btn primary">……</button>
  </div>

  <div id="summary" class="screen center slab hidden">
    <p class="day">第二章</p>
    <h2 id="summary-line"></h2>
    <div id="summary-icons"></div>
    <p class="next">崖壁在前面等着……（第二章 · 崖壁）</p>
    <div class="row">
      <button id="btn-walk" class="btn ghost">继续走走</button>
      <button id="btn-notes" class="btn ghost">设计说明</button>
      <button id="btn-again" class="btn primary">再来一次</button>
    </div>
  </div>

  <div id="notes" class="screen center slab hidden">
    <h2>设计说明</h2>
    <div class="notes-body">
      <p>裂缝拦路的时候，先想起声音的是身体。</p>
      <p>jump 里的 p，你在第一章就学会了。学过的声音会从记忆里凝出石头。每一章，都站在前一章的肩膀上。</p>
    </div>
    <button id="notes-close" class="btn primary">回到走廊</button>
  </div>

  <div id="journal" class="screen slab hidden">
    <div class="journal-head slab">
      <span class="j-name">析声录</span>
      <div class="seg">
        <button class="seg-btn active" data-tab="words">词语</button>
        <button class="seg-btn" data-tab="runes">声音</button>
      </div>
      <span id="rune-count">0/48</span>
      <button id="journal-close" class="btn small ghost">合上</button>
    </div>
    <div class="journal-body">
      <div id="journal-words"></div>
      <div id="journal-runes" class="hidden"></div>
    </div>
  </div>
  <div id="echo-strip" class="hidden"></div>
  <div id="toast" class="hidden"></div>
</div>
<div id="drag-ghost" class="hidden"></div>
<script type="module" src="js/ch2.js"></script>
</body>
</html>
