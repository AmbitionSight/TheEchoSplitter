<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>析声者 · 第三间房</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>

  <div id="title" class="screen center glass hidden">
    <div class="rune-float" aria-hidden="true">ᚱ</div>
    <h1>析声者</h1>
    <p class="sub">ROOM THREE</p>
    <button id="btn-start" class="btn primary">开 始</button>
  </div>

  <div id="prologue" class="screen center glass hidden">
    <p>崖壁下面只有一条窄路。</p>
    <p>头顶的墙上，垂着一截断掉的绳子。</p>
    <p>上面风声更大。</p>
    <p class="tap">点击继续</p>
  </div>

  <div id="hud-avatar" class="glass hidden">
    <canvas id="avatar-fig" width="56" height="64" aria-hidden="true"></canvas>
    <div id="hand-slot" class="hand-slot"></div>
  </div>

  <div id="hintbar" class="glass hidden"><span id="hint-text"></span></div>

  <div id="hotbar" class="glass hidden">
    <div id="bar-row">
      <div id="stone-cells"></div>
      <span class="bar-sep"></span>
      <div id="item-cells"></div>
      <div id="craft-row">
        <div class="slot" data-slot="0"></div>
        <div class="slot" data-slot="1"></div>
        <div class="slot" data-slot="2"></div>
        <div class="slot" data-slot="3"></div>
      </div>
      <button class="rune-btn" id="btn-book" title="析声录">ᚱ</button>
    </div>
  </div>

  <div id="summary" class="screen center glass hidden">
    <p class="day">第三间房</p>
    <h2 id="summary-line"></h2>
    <div id="summary-icons"></div>
    <p class="next">风从更深的黑暗里吹来……（第四章 · 未完待续）</p>
    <div class="row">
      <button id="btn-walk" class="btn ghost">继续走走</button>
      <button id="btn-notes" class="btn ghost">设计说明</button>
      <button id="btn-again" class="btn primary">再来一次</button>
    </div>
  </div>

  <div id="notes" class="screen center glass hidden">
    <h2>设计说明</h2>
    <div class="notes-body">
      <p>绳断了，还挂着。</p>
      <p>rope 里的 əʊ 和 p，前两间房就学会了。学过的声音会从记忆里凝出石头。越往里走，一件新工具只要一颗新声音。</p>
    </div>
    <button id="notes-close" class="btn primary">回到崖下</button>
  </div>

  <div id="journal" class="screen glass hidden">
    <div class="journal-head glass">
      <span class="j-name">析声录</span>
      <div class="seg">
        <button class="seg-btn active" data-tab="words">词语</button>
        <button class="seg-btn" data-tab="runes">声音</button>
      </div>
      <span id="rune-count">0/48</span>
      <button id="journal-close" class="btn small ghost">合上</button>
    </div>
    <div class="journal-body">
      <div id="journal-words"></div>
      <div id="journal-runes" class="hidden"></div>
    </div>
  </div>
  <div id="echo-strip" class="glass hidden"></div>
  <div id="toast" class="glass hidden"></div>
</div>
<div id="drag-ghost" class="hidden"></div>
<script type="module" src="js/ch3.js"></script>
</body>
</html>
